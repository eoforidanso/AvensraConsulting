name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The build must succeed with no secrets present — marketing pages render
      # and commerce degrades gracefully until keys are configured.
      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high
